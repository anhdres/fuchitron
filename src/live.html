<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fuchitron — Spectating</title>
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Lexend:wght@400;700;900&family=Anton+SC&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="/icons/logo.svg" alt="Logo Fuchitron" class="brand-logo" />
          <h1>FUCHITRON</h1>
        </div>
        <div class="live-dot" id="liveDot"><span class="dot"></span></div>
      </div>
    </header>

    <main class="app spectate-view" id="spectateView">
      <div class="spectate-no-code" id="noCode">
        <p id="noCodeText">No se proporcionó código de partido.</p>
        <small id="noCodeHint">Accedé desde el link que te pasaron en Fuchitron.</small>
      </div>

      <section class="live-block cardless" id="liveBlock" hidden>
        <div class="live-row">
          <div class="live-pill"><span class="dot"></span><span id="livePillText">EN VIVO</span></div>
          <div class="period" id="periodLabel">1T</div>
        </div>
        <div class="clock" id="clock">00:00</div>
        <div class="overtime" id="overtime"></div>
      </section>

      <section class="scoreboard" id="scoreboard" hidden>
        <div class="team-slot">
          <small class="team-tag" id="tagA">LOCAL</small>
          <article class="team-panel team-a">
            <strong id="labelA"></strong>
            <div class="score-number score-a" id="scoreA" aria-live="polite" aria-atomic="true">0</div>
          </article>
        </div>
        <div class="vs-chip">VS</div>
        <div class="team-slot">
          <small class="team-tag" id="tagB">VISITANTE</small>
          <article class="team-panel team-b">
            <strong id="labelB"></strong>
            <div class="score-number score-b" id="scoreB" aria-live="polite" aria-atomic="true">0</div>
          </article>
        </div>
      </section>

      <section class="goal-timeline" id="timelineSection" hidden>
        <h3 id="timelineTitle">Timeline</h3>
        <ul id="goalsList" class="goals-list"></ul>
      </section>
    </main>

    <script>
    const SUPABASE_URL = 'https://jorehxhrnpggvsgdnrpk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_grJRaqShOSYw5H2fBdEyAA_84EUY-tB';

    // Minimal i18n for the spectator view — only strings rendered here.
    const SPECTATE_I18N = {
      es: { local: 'LOCAL', visitante: 'VISITANTE', enVivo: 'EN VIVO', porComenzar: 'POR COMENZAR', finalizado: 'FINAL', resultadoFinal: 'RESULTADO FINAL', timeline: 'Timeline', sinEventos: 'Sin eventos todavía.', gol: 'Gol', finalPartido: 'Final del partido', noCode: 'No se proporcionó código de partido.', noCodeHint: 'Accedé desde el link que te pasaron en Fuchitron.', noMatch: 'Partido no encontrado.', noMatchHint: 'El code no existe o el partido ya terminó. Pedile a tu referi que genere un link nuevo.', t1: '1T', t2: '2T' },
      en: { local: 'HOME', visitante: 'AWAY', enVivo: 'LIVE', porComenzar: 'NOT STARTED', finalizado: 'FULL TIME', resultadoFinal: 'FINAL SCORE', timeline: 'Timeline', sinEventos: 'No events yet.', gol: 'Goal', finalPartido: 'Full time', noCode: 'No match code was provided.', noCodeHint: 'Open the link someone shared with you from Fuchitron.', noMatch: 'Match not found.', noMatchHint: "The code doesn't exist or the match already ended. Ask the host to share a new link.", t1: '1st', t2: '2nd' },
      de: { local: 'HEIM', visitante: 'GAST', enVivo: 'LIVE', porComenzar: 'NOCH NICHT BEGONNEN', finalizado: 'ENDE', resultadoFinal: 'ENDERSTAND', timeline: 'Spielverlauf', sinEventos: 'Noch keine Ereignisse.', gol: 'Tor', finalPartido: 'Spielende', noCode: 'Kein Spielcode angegeben.', noCodeHint: 'Öffne den Link, den du von Fuchitron bekommen hast.', noMatch: 'Spiel nicht gefunden.', noMatchHint: 'Der Code existiert nicht oder das Spiel ist beendet. Bitte den Veranstalter um einen neuen Link.', t1: '1. HZ', t2: '2. HZ' },
      pt: { local: 'MANDANTE', visitante: 'VISITANTE', enVivo: 'AO VIVO', porComenzar: 'AINDA NÃO COMEÇOU', finalizado: 'FIM', resultadoFinal: 'RESULTADO FINAL', timeline: 'Linha do tempo', sinEventos: 'Sem eventos.', gol: 'Golo', finalPartido: 'Fim de jogo', noCode: 'Nenhum código de jogo fornecido.', noCodeHint: 'Abre o link que te passaram do Fuchitron.', noMatch: 'Jogo não encontrado.', noMatchHint: 'O código não existe ou o jogo já acabou. Pede ao organizador um link novo.', t1: '1MT', t2: '2MT' },
      fr: { local: 'DOMICILE', visitante: 'EXTÉRIEUR', enVivo: 'EN DIRECT', porComenzar: 'PAS ENCORE COMMENCÉ', finalizado: 'FIN', resultadoFinal: 'SCORE FINAL', timeline: 'Chronologie', sinEventos: 'Aucun événement.', gol: 'But', finalPartido: 'Fin du match', noCode: 'Aucun code de match fourni.', noCodeHint: 'Ouvre le lien qu\'on t\'a partagé depuis Fuchitron.', noMatch: 'Match introuvable.', noMatchHint: "Le code n'existe pas ou le match est déjà terminé. Demande un nouveau lien à l'organisateur.", t1: '1T', t2: '2T' },
      it: { local: 'CASA', visitante: 'TRASFERTA', enVivo: 'IN DIRETTA', porComenzar: 'NON INIZIATA', finalizado: 'FINE', resultadoFinal: 'RISULTATO FINALE', timeline: 'Cronologia', sinEventos: 'Nessun evento.', gol: 'Goal', finalPartido: 'Fine partita', noCode: 'Nessun codice partita fornito.', noCodeHint: 'Apri il link che ti hanno condiviso da Fuchitron.', noMatch: 'Partita non trovata.', noMatchHint: "Il codice non esiste o la partita è già finita. Chiedi un nuovo link all'organizzatore.", t1: '1T', t2: '2T' },
      zh: { local: '主队', visitante: '客队', enVivo: '直播中', porComenzar: '未开始', finalizado: '终场', resultadoFinal: '最终比分', timeline: '时间线', sinEventos: '暂无事件', gol: '进球', finalPartido: '比赛结束', noCode: '未提供比赛代码。', noCodeHint: '请打开从 Fuchitron 分享的链接。', noMatch: '未找到比赛。', noMatchHint: '代码不存在或比赛已结束。请向主办方索取新链接。', t1: '第1节', t2: '第2节' },
    };
    const urlLang = new URLSearchParams(location.search).get('lang');
    const SPECTATE_LANG = (urlLang && SPECTATE_I18N[urlLang]) ? urlLang : 'es';
    function t(key) {
      return (SPECTATE_I18N[SPECTATE_LANG] && SPECTATE_I18N[SPECTATE_LANG][key]) || SPECTATE_I18N.es[key] || key;
    }

    function getMatchCode() {
      // 1. Try query string first (legacy /live.html?code=XXXXX)
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get('code');
      if (fromQuery) return fromQuery;
      // 2. Fallback: read from path (e.g. /live/BLSH8S) — vercel.json rewrites /live/:code to /live.html
      const path = window.location.pathname;
      const match = path.match(/\/live\/([A-Z0-9]+)/i);
      return match ? match[1] : null;
    }

    function clockTxt(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    async function fetchMatch(code) {
      const url = `${SUPABASE_URL}/rest/v1/matches?match_code=eq.${encodeURIComponent(code)}`;
      const r = await fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
      });
      return r.json();
    }

    function renderGoals(m, periodMinutes) {
      const list = document.getElementById('goalsList');
      list.innerHTML = '';
      const goals = Array.isArray(m.goals) ? m.goals : [];
      const base = m.current_half === 1 ? 0 : periodMinutes;
      const items = goals
        .map(g => ({
          minuteAbs: base + (g.minute || 0),
          side: g.side,
          team: g.side === 'A' ? (m.team_a || t('local')) : (m.team_b || t('visitante')),
        }))
        .sort((a, b) => a.minuteAbs - b.minuteAbs);
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'spectate-empty';
        li.textContent = t('sinEventos');
        list.appendChild(li);
        return;
      }
      items.forEach(it => {
        const li = document.createElement('li');
        const minute = document.createElement('span');
        minute.className = 'event-minute';
        minute.textContent = `${it.minuteAbs}'`;
        const text = document.createElement('span');
        text.className = 'goal-meta';
        text.textContent = `⚽ ${(it.team || '').toUpperCase()}`;
        li.appendChild(minute);
        li.appendChild(text);
        list.appendChild(li);
      });
    }

    function renderMatch(m) {
      document.getElementById('noCode').hidden = true;
      document.getElementById('liveBlock').hidden = false;
      document.getElementById('scoreboard').hidden = false;
      document.getElementById('timelineSection').hidden = false;

      const ta = m.team_a || t('local');
      const tb = m.team_b || t('visitante');
      document.getElementById('labelA').textContent = ta;
      document.getElementById('labelB').textContent = tb;
      document.getElementById('tagA').textContent = t('local');
      document.getElementById('tagB').textContent = t('visitante');
      document.getElementById('scoreA').textContent = m.score_a || 0;
      document.getElementById('scoreB').textContent = m.score_b || 0;
      document.getElementById('livePillText').textContent = m.running && !m.finished ? t('enVivo') : (m.finished ? t('resultadoFinal') : t('porComenzar'));
      document.getElementById('timelineTitle').textContent = t('timeline');

      const matchStarted = !!m.match_start_ts || m.half_seconds > 0 || m.running || m.finished;
      const half = m.current_half || 1;
      const periodLabel = document.getElementById('periodLabel');
      periodLabel.textContent = !matchStarted
        ? t('porComenzar')
        : (m.finished ? t('finalizado') : (half === 1 ? t('t1') : t('t2')));

      // Compute live elapsed time from match_start_ts when running, so the
      // spectator doesn't see a stale half_seconds value between polls.
      let halfSeconds = m.half_seconds || 0;
      if (m.running && m.match_start_ts && !m.finished) {
        const startMs = Number(m.match_start_ts);
        if (Number.isFinite(startMs) && startMs > 0) {
          const computed = Math.floor((Date.now() - startMs) / 1000);
          // Don't let the clock go backwards relative to the last poll. After
          // the timer fix (commit 41e5554, 2026-09-02) match_start_ts gets
          // re-anchored on every resume, so a freshly-resumed match can have
          // a computed elapsed that's lower than the last paused
          // half_seconds seen by the spectator. Take whichever is higher.
          halfSeconds = Math.max(halfSeconds, computed);
        }
      }

      const clockEl = document.getElementById('clock');
      const overtimeEl = document.getElementById('overtime');
      if (!matchStarted) {
        clockEl.hidden = true;
        overtimeEl.hidden = true;
      } else {
        clockEl.hidden = false;
        overtimeEl.hidden = false;
        clockEl.textContent = clockTxt(halfSeconds);
        const periodMinutes = m.period_minutes || 45;
        const over = halfSeconds - periodMinutes * 60;
        overtimeEl.textContent = over > 0 ? `+${Math.floor((over - 1) / 60) + 1}` : '';
      }

      const dot = document.getElementById('liveDot');
      dot.style.display = (m.running && !m.finished) ? 'flex' : 'none';

      renderGoals(m, m.period_minutes || 45);
    }

    function localizeNoCode() {
      document.getElementById('noCodeText').textContent = t('noCode');
      document.getElementById('noCodeHint').textContent = t('noCodeHint');
    }

    function showNoCode() {
      document.getElementById('noCodeText').textContent = t('noCode');
      document.getElementById('noCodeHint').textContent = t('noCodeHint');
      document.getElementById('noCode').hidden = false;
    }

    function showNoMatch() {
      document.getElementById('noCodeText').textContent = t('noMatch');
      document.getElementById('noCodeHint').textContent = t('noMatchHint');
      document.getElementById('noCode').hidden = false;
    }

    let pollInterval = null;
    let pollAttempts = 0;
    let lastSeenMatch = null;

    async function poll() {
      const code = getMatchCode();
      if (!code) return;
      try {
        const matches = await fetchMatch(code);
        if (matches && matches.length > 0) {
          lastSeenMatch = matches[0];
          pollAttempts = 0;
          renderMatch(matches[0]);
          // Hide the noMatch overlay once we have data
          document.getElementById('noCode').hidden = true;
        } else {
          pollAttempts++;
          // After a few failed polls, show a more helpful "match not found" message
          if (pollAttempts >= 2) {
            showNoMatch();
          }
        }
      } catch(e) {
        console.error('[spectate] poll error:', e);
      }
    }

    function startPolling() {
      poll();
      pollInterval = setInterval(poll, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      localizeNoCode();
      const code = getMatchCode();
      if (!code) {
        showNoCode();
        return;
      }
      startPolling();
    });
    </script>
  </body>
</html>
